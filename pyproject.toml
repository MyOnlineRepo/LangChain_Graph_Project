[project]
name = "lcgraph"
version = "0.1.0"
description = "LangChain 1.x / LangGraph 1.x Lern- und Experimentierprojekt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-anthropic>=1.7.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
